<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E9ECEA;        /* 霧灰綠 */
    --ink: #5E6663;       /* 石板灰 */
    --sage: #A9B8A6;      /* 鼠尾草 */
    --rose: #D2B4AE;      /* 乾燥玫瑰 */
    --blue: #A7B6C2;      /* 霧藍 */
    --sand: #D9CBB3;      /* 燕麥 */
    --lilac: #BCB1C3;     /* 灰紫 */
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Outfit", "Noto Sans TC", system-ui, sans-serif;
    display: grid;
    place-items: center;
  }
  main { text-align: center; padding: 2rem; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .language-picker {
    position: fixed;
    top: max(1rem, env(safe-area-inset-top));
    right: max(1rem, env(safe-area-inset-right));
    z-index: 1;
    padding: 0.65rem 2.3rem 0.65rem 0.9rem;
    border: 1px solid rgb(94 102 99 / 20%);
    border-radius: 999px;
    background: rgb(251 251 249 / 85%);
    color: var(--ink);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .language-picker:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  [dir="rtl"] .language-picker {
    right: auto;
    left: max(1rem, env(safe-area-inset-left));
    padding: 0.65rem 0.9rem 0.65rem 2.3rem;
  }

  h1 {
    margin: 0;
    font-weight: 600;
    font-size: clamp(3rem, 12vw, 8rem);
    letter-spacing: -0.02em;
    line-height: 1;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.06em;
  }
  h1 span {
    display: inline-block;
    padding: 0.08em 0.14em;
    border-radius: 0.22em;
    color: #FBFBF9;
    animation: settle 700ms cubic-bezier(.2,.8,.3,1) both;
  }
  h1 .gap { background: none; width: 0.25em; padding: 0; }

  .s { background: var(--sage); }
  .r { background: var(--rose); }
  .b { background: var(--blue); }
  .d { background: var(--sand); }
  .l { background: var(--lilac); }

  p {
    margin: 2rem 0 0;
    font-weight: 300;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(-0.4em) rotate(-6deg); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    h1 span { animation: none; }
  }
</style>
</head>
<body>
  <label class="visually-hidden" for="language-picker">選擇語言 / Choose language</label>
  <select class="language-picker" id="language-picker" aria-label="選擇語言 / Choose language">
    <option value="zh-Hant">繁體中文</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="es">Español</option>
    <option value="ar">العربية</option>
  </select>
  <main>
    <h1 aria-label="Hello, World">
      <span class="s" style="animation-delay:0ms">H</span>
      <span class="r" style="animation-delay:60ms">e</span>
      <span class="b" style="animation-delay:120ms">l</span>
      <span class="d" style="animation-delay:180ms">l</span>
      <span class="l" style="animation-delay:240ms">o</span>
      <span class="gap"></span>
      <span class="b" style="animation-delay:300ms">W</span>
      <span class="s" style="animation-delay:360ms">o</span>
      <span class="l" style="animation-delay:420ms">r</span>
      <span class="r" style="animation-delay:480ms">l</span>
      <span class="d" style="animation-delay:540ms">d</span>
    </h1>
    <p id="page-description">我的第一個網頁 🌿</p>
  </main>
  <script>
    const translations = {
      "zh-Hant": { greeting: "Hello, World", description: "我的第一個網頁 🌿", direction: "ltr" },
      en: { greeting: "Hello, World", description: "My first webpage 🌿", direction: "ltr" },
      ja: { greeting: "こんにちは、世界", description: "私の最初のウェブページ 🌿", direction: "ltr" },
      ko: { greeting: "안녕, 세상!", description: "나의 첫 번째 웹페이지 🌿", direction: "ltr" },
      fr: { greeting: "Bonjour le monde", description: "Ma première page web 🌿", direction: "ltr" },
      de: { greeting: "Hallo Welt", description: "Meine erste Webseite 🌿", direction: "ltr" },
      es: { greeting: "Hola, mundo", description: "Mi primera página web 🌿", direction: "ltr" },
      ar: { greeting: "مرحبًا بالعالم", description: "صفحتي الأولى على الويب 🌿", direction: "rtl" }
    };

    const picker = document.querySelector("#language-picker");
    const heading = document.querySelector("h1");
    const description = document.querySelector("#page-description");

    function setLanguage(language) {
      const translation = translations[language] || translations["zh-Hant"];
      const letters = [...translation.greeting];
      heading.replaceChildren(...letters.map((letter, index) => {
        const span = document.createElement("span");
        span.className = ["s", "r", "b", "d", "l"][index % 5];
        span.style.animationDelay = `${Math.min(index * 60, 900)}ms`;
        span.textContent = letter === " " ? " " : letter;
        return span;
      }));
      heading.setAttribute("aria-label", translation.greeting);
      description.textContent = translation.description;
      document.documentElement.lang = language;
      document.documentElement.dir = translation.direction;
      document.title = translation.greeting;
      picker.value = language;
      try {
        localStorage.setItem("preferred-language", language);
      } catch {
        // Language switching still works when storage is unavailable.
      }
    }

    picker.addEventListener("change", (event) => setLanguage(event.target.value));

    let initialLanguage = "zh-Hant";
    try {
      const savedLanguage = localStorage.getItem("preferred-language");
      if (savedLanguage && translations[savedLanguage]) {
        initialLanguage = savedLanguage;
      } else {
        const browserLanguage = navigator.language.toLowerCase();
        const matchingLanguage = Object.keys(translations).find((language) =>
          browserLanguage === language.toLowerCase() || browserLanguage.startsWith(`${language.split("-")[0].toLowerCase()}-`)
        );
        if (matchingLanguage) initialLanguage = matchingLanguage;
      }
    } catch {
      // Fall back to Traditional Chinese when storage is unavailable.
    }
    setLanguage(initialLanguage);
  </script>
</body>
</html>
